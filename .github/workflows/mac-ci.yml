name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Apple Silicon · macOS 15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify runner and toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version

      - name: Check patch and script syntax
        run: |
          git diff --check
          for script in scripts/*.sh; do zsh -n "$script"; done

      - name: Check Swift formatting
        run: xcrun swift format lint --strict --recursive --parallel Sources Tests Package.swift

      - name: Run Swift Testing suites
        run: swift test

      - name: Build and verify local app
        run: ./scripts/build-app.sh
